run: "docker compose up --build"
seed: "python -m scripts.seed"
test: "pytest -q"
base_url: "http://localhost:8000"
endpoints:
  health: "/health"
  images: "/api/v1/images"
  posts: "/api/v1/posts"
  matches: "/api/v1/posts/{post_id}/images"
  reviews: "/api/v1/reviews"
  evaluation: "/api/v1/evaluation"
