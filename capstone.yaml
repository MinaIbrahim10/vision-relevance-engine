name: vision-relevance-engine

run: docker compose up -d --build

seed: docker compose exec api sh -c "python -m scripts.download_corpus && python -m scripts.seed"

test: docker compose exec api python -m pytest -q

base_url: http://localhost:8000

health_endpoint: /health

endpoints:
  - /api/v1/images
  - /api/v1/posts
  - /api/v1/jobs/process-images
  - /api/v1/reviews
  - /api/v1/evaluation
  - /api/v1/usage
  - /api/v1/alerts
