services:
  api:
    build: .
    command: >
      sh -c "
      python -m alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/vision_relevance.db
      VISION_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_VISION_MODEL: llava:latest
      EMBEDDING_MODEL: bge-m3:latest
      MIN_VISION_CONFIDENCE: "0.60"
      MIN_SIMILARITY_SCORE: "0.45"
      AI_BUDGET_USD: "1.00"
    volumes:
      - app_data:/data
      - ./data:/app/data
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: .
    command: >
      sh -c "
      python -m alembic upgrade head &&
      python -m app.worker
      "
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////data/vision_relevance.db
      VISION_PROVIDER: ollama
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_VISION_MODEL: llava:latest
      EMBEDDING_MODEL: bge-m3:latest
      MIN_VISION_CONFIDENCE: "0.60"
      MIN_SIMILARITY_SCORE: "0.45"
      AI_BUDGET_USD: "1.00"
    volumes:
      - app_data:/data
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

volumes:
  app_data:
